name: CI
on:
  pull_request:
    branches: [worktree-macos-reskin]
  push:
    branches: [worktree-macos-reskin]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/worktree-macos-reskin' }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/shared build
      - run: pnpm -C apps/api test
      - run: pnpm -C apps/api lint
      - run: pnpm -C apps/web build
      - run: pnpm -C packages/shared test
      - name: Golden JSON sync
        run: |
          diff <(cat apps/engine/testdata/fixtures/*.json | jq -S) \
               <(cat packages/shared/testdata/fixtures/*.json | jq -S)
      - run: pnpm audit --audit-level=high

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - working-directory: apps/engine
        run: go vet ./...
      - working-directory: apps/engine
        run: go test -race -count=1 ./...
      - working-directory: apps/engine
        run: test -z "$(gofmt -l .)"

  ci-ok:
    needs: [node, engine]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
